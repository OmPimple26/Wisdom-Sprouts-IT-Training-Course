<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Mini Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
        }

        .counter-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #333333;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #value {
            font-size: 4.5rem;
            font-weight: bold;
            color: #222222;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-decrease {
            background-color: #ff4d4d;
            color: white;
        }

        .btn-decrease:hover {
            background-color: #ff3333;
        }

        .btn-reset {
            background-color: #777777;
            color: white;
        }

        .btn-reset:hover {
            background-color: #555555;
        }

        .btn-increase {
            background-color: #2ecc71;
            color: white;
        }

        .btn-increase:hover {
            background-color: #27ae60;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div class="counter-container">
        <h1>Counter</h1>
        <div id="value">0</div>
        <div class="button-group">
            <button class="btn btn-decrease">Dec</button>
            <button class="btn btn-reset">Reset</button>
            <button class="btn btn-increase">Inc</button>
        </div>
    </div>

    <script>
        // Initialize the count variable
        let count = 0;

        // Select the value display and all buttons
        const valueDisplay = document.getElementById('value');
        const buttons = document.querySelectorAll('.btn');

        // Add a single event listener logic using forEach
        buttons.forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                const styles = e.currentTarget.classList;
                
                // Determine action based on class name
                if (styles.contains('btn-decrease')) {
                    count--;
                } else if (styles.contains('btn-increase')) {
                    count++;
                } else {
                    count = 0;
                }

                // Update text color dynamically based on positive/negative values
                if (count > 0) {
                    valueDisplay.style.color = '#27ae60';
                } else if (count < 0) {
                    valueDisplay.style.color = '#ff3333';
                } else {
                    valueDisplay.style.color = '#222222';
                }

                // Render the updated count to the DOM
                valueDisplay.textContent = count;
            });
        });
    </script>
</body>
</html>

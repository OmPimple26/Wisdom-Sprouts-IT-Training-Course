<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Password Generator</h1>

      <p class="subtitle">Create a strong and secure password</p>

      <!-- Password display -->
      <div class="password-box">
        <input type="text" id="password" readonly placeholder="Your password" />

        <button id="copyBtn">Copy</button>
      </div>

      <!-- Password length -->
      <div class="length-section">
        <div class="length-heading">
          <label for="length">Password Length</label>

          <span id="lengthValue">12</span>
        </div>

        <input type="range" id="length" min="6" max="30" value="12" />
      </div>

      <!-- Password options -->
      <div class="options">
        <label>
          <input type="checkbox" id="uppercase" checked />
          Uppercase Letters
        </label>

        <label>
          <input type="checkbox" id="lowercase" checked />
          Lowercase Letters
        </label>

        <label>
          <input type="checkbox" id="numbers" checked />
          Numbers
        </label>

        <label>
          <input type="checkbox" id="symbols" checked />
          Symbols
        </label>
      </div>

      <!-- Strength -->
      <div class="strength-section">
        <div class="strength-heading">
          <span>Password Strength</span>

          <span id="strengthText">Strong</span>
        </div>

        <div class="strength-bar">
          <div id="strengthFill"></div>
        </div>
      </div>

      <!-- Generate button -->
      <button id="generateBtn" class="generate-btn">Generate Password</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>

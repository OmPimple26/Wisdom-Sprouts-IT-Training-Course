        // 20. Check if All Characters in a String Are Unique ->

        function areCharactersUnique(str){
            for(let i=0; i<str.length; i++){
                for(let j = i+1; j < str.length; j++){
                    if(str[i] === str[j]){
                        return false;
                    }
                }
            }

            return true;
        }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruitish</title>

    <link rel="stylesheet" href="index.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  </head>

  <body>
    <!-- Navbar -->
    <nav>
      <div class="logo">🍉 <span>Fruitish</span></div>

      <div class="cart">
        <i class="fa-solid fa-glass-water"></i>
      </div>
    </nav>

    <!-- Heading -->
    <section class="heading">
      <h1>🍓🍊🥝 Welcome to Fruits Shop 🍈🍉🍇</h1>
    </section>

    <!-- Products -->
    <section class="products">
      <div class="card">
        <div class="image">
          <img src="images/apple.jpg" />

          <span class="price">₹120</span>
        </div>

        <div class="name">Apple</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/banana.jpg" />

          <span class="price">₹60</span>
        </div>

        <div class="name">Banana</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/orange.jpg" />

          <span class="price">₹80</span>
        </div>

        <div class="name">Orange</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/mango.jpg" />

          <span class="price">₹150</span>
        </div>

        <div class="name">Mango</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/grapes.jpg" />

          <span class="price">₹100</span>
        </div>

        <div class="name">Grapes</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/pineapple.jpg" />

          <span class="price">₹90</span>
        </div>

        <div class="name">Pineapple</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/watermelon.jpg" />

          <span class="price">₹50</span>
        </div>

        <div class="name">Watermelon</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/strawberry.jpg" />

          <span class="price">₹200</span>
        </div>

        <div class="name">Strawberry</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/kiwi.jpg" />

          <span class="price">₹180</span>
        </div>

        <div class="name">Kiwi</div>
      </div>

      <div class="card">
        <div class="image">
          <img src="images/cherry.JPG" />

          <span class="price">₹250</span>
        </div>

        <div class="name">Cherry</div>
      </div>
    </section>
  </body>
</html>

      //   Example 2 - Encapsulation + Abstraction + Inheritance + Polymorphism

      class UPI {
        #balance;
        constructor(upi_id, amount, name) {
          this.upi_id = upi_id;
          this.#balance = amount;
          this.name = name;
        }

        get_balance() {
          return `Your available balance is ₹${this.#balance}`;
        }

        send_money(amount, id) {
          if (amount < 0) {
            console.log("Invalid Amount");
            return;
          }
          if (amount > this.#balance) {
            console.log("Insufficient Balance...");
            return;
          }

          this.#balance -= amount;
          console.log(`${amount} has been sent to ${id} UPI_ID`);
          this.get_balance();
        }

        pay(amount, id) {
          this.send_money(amount, id);
        }
      }

      class PhonePay extends UPI {
        pay(amount, id) {
          this.send_money(amount, id);
          console.log("Payment has been done by PhonePe");
        }
      }

      class GooglePay extends UPI {
        pay(amount, id) {
          this.send_money(amount, id);
          console.log("Payment has been done by GooglePay");
        }
      }

      const u1 = new GooglePay("107878@ybl", 20000, "Om");
      const u2 = new PhonePay("74396@sbi", 20000, "Anushka");

      function PayTheBill(app, amount, id) {
        app.pay(amount, id);
      }

      PayTheBill(u1, 200, "7261736@ybl");
      console.log("\n");
      PayTheBill(u2, 600, "2323275@SBI");

<!-- JavaScript is fundamentally a prototype-based object-oriented language. Objects inherit properties and methods through the prototype chain. JavaScript also provides the class syntax, but classes internally use prototypes for inheritance. -->

<!-- A prototype is an object from which another object can inherit properties and methods. JavaScript uses the prototype chain to look for properties and methods that are not directly present on an object. -->

<!-- Note:

In Java
Class → Object

In JavaScript
Object → Prototype → Prototype → ... 

-->

<!-- Prototype chaining is JavaScript's mechanism for property and method lookup. When a property or method is not found on an object, JavaScript searches its prototype, then the prototype's prototype, continuing up the chain until the property is found or the chain reaches null.

        Object
          ↓
      Prototype
          ↓
  Prototype's Prototype
          ↓
         null 
         
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype</title>
</head>
<body>
    <h1>Prototype</h1>

    <script>
        Array.prototype.om = function(){
            return this.length + 20;
        }

        let arr = [1,2,3,4];
        console.log(arr.om());  // 24

        console.log(arr.__proto__);  // Array.prototype
        console.log(arr.__proto__.__proto__);  // Object.prototype
        console.log(arr.__proto__.__proto__.__proto__);  // null
    </script>
</body>
</html>

        // 21. Provide the most repeated character and number of repeated? ->

        let arr = ["a", "b", "c", "a", "d"];

        function getMaxElementCount(arr){
            let obj = {};

            arr.forEach(element => {
                if(obj.hasOwnProperty(element)){
                    obj[element] += 1;
                }else{
                    obj[element] = 1;
                }
            });

            return obj;
        }

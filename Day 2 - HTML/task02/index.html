<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-form</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <center><h2><u>IT Selection</u></h2></center>

    <fieldset>
    <form action="">
        <!-- name email number date of birth education -->

        <label for="name">Name: </label>
        <input id="name" "text" placeholder="Enter your name">

        <br><br>

        <label for="email">Email: </label>
        <input id="email" type="email" placeholder="Enter your email">

        <br><br>

        <label for="phone">Phone Number: </label>
        <input id="phone" type="number">

        <br><br>

        <label for="dob">Date of Birth: </label>
        <input id="dob" type="date">

        <br><br>

        <fieldset>
            <legend>Gender: </legend>
                <label>Male</label>
                <input type="radio" name="gender">

                <br>

                <label>Female</label>
                <input type="radio" name="gender">
        </fieldset>

        <br>

        <label>City:</label>
        <select>
            <option>-</option>
            <option>Pune</option>
            <option>Mumbai</option>
            <option>Delhi</option>
            <option>Chennai</option>
        </select>
        
        <br><br>

        <fieldset>
            <legend>Documents: </legend>

            <label>Aadhar Card</label>
            <input type="checkbox">

            &nbsp;

            <label>Passport</label>
            <input type="checkbox">

            &nbsp;

            <label>PanCard</label>
            <input type="checkbox">

            &nbsp;

            <label>Driving License</label>
            <input type="checkbox">
        </fieldset>

        <br>

        <label>Upload Your Resume: </label>
        &nbsp;
        <input type="file">

        <br><br>

        <!-- <button>Submit your form</button> -->
        <input type="submit" value="Submit your form">
    </form>
    </fieldset>

    <br><br>

    <fieldset>
        <legend>Connect Us</legend>
        <a href="https://www.google.com" target="_blank">Visit our website: 🌐</a>
        <br><br>
        <a href="mailto:xyzcompany@email.com">Mail us on: 📧</a>
        <br><br>
        <a href="tel:0798795254">Call us 📞</a>
    </fieldset>
</body>

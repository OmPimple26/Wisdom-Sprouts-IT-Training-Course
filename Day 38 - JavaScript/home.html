<html lang="en">

    <title>My Document</title>
</head>
<body>
    <h1>JavaScript DOM Manipulation</h1>

    <button class="btn" onclick="changeColor()">Change color</button>
    <button class="btn" onclick="revertChanges()">Revert changes</button>

    <section>
        <div>
            <section>
                <h4 id="longcut">This is the long cut</h4>
            </section>
        </div>
    </section>

    <script>
        // document.body.style.backgroundColor = "pink";

        // img.setAttribute('alt', 'Modak image');

        // document.body.appendChild(img);

        // img.height = 300

        function changeColor(){
            document.body.style.backgroundColor = "black";
            document.body.firstElementChild.style.color = "magenta";
        }

        function revertChanges(){
            document.body.style.backgroundColor = "white";
            document.body.firstElementChild.style.color = "black";
        }


        document.body.getElementsByTagName('h4')[0].style.backgroundColor = "purple"
        // 'purple'

        document.body.getElementsByClassName('btn')[0].style.backgroundColor = "yellow"
        // 'yellow'

        // document.getElementById('longcut').style.backgroundColor = "blue"

    </script>
</body>

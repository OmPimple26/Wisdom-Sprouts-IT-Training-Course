<!-- async and await are the keywords that allow you to write asynchronous, non-blocking code that looks and behaves like clean, readable synchronous code. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Await</title>
  </head>
  <body>
    <h1>Async Await</h1>

    <script>
      // Define an asynchronous function to fetch the products
      async function fetchProducts() {
        try {
          // 1. Send a GET request to the FakeStore API endpoint
          const response = await fetch("https://fakestoreapi.com/products");

          // 2. Check if the network response was successful (status code 200-299)
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          // 3. Parse the data as JSON (this also returns a promise)
          const data = await response.json();

          // 4. Log or use the retrieved products array
          console.log("Products fetched successfully:", data);
          return data;
        } catch (error) {
          // Handle network errors, invalid endpoints, or JSON parsing issues
          console.error(
            "Error fetching data from FakeStore API:",
            error.message,
          );
        }
      }

      // Call the function to execute the API request
      fetchProducts();
    </script>
  </body>
</html>

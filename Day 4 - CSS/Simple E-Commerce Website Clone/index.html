<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <h2>ShopEasy</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Contact</a>
        </nav>

        <button>Add to Cart</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to ShopEasy</h1>
        <p>Best Deals on Electronics, Fashion & Accessories</p>
        <button>Shop Now</button>
    </section>

    <!-- Products -->
    <section class="products">

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/41HfXFpPP-L._SY300_SX300_QL70_FMwebp_.jpg" alt="Product">
            <h3>Wireless Headphones</h3>
            <p>₹1,149</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/41HKghh3HLL._SY300_SX300_QL70_FMwebp_.jpg" alt="Product">
            <h3>Smart Watch</h3>
            <p>₹1,099</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/31xBZ2QQKML._SY300_SX300_QL70_FMwebp_.jpg" alt="Product">
            <h3>Bluetooth Speaker</h3>
            <p>₹599</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/61rWcMP4s9L._SY695_.jpg" alt="Product">
            <h3>Sports Shoes</h3>
            <p>₹1,179</p>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

</body>
</html>

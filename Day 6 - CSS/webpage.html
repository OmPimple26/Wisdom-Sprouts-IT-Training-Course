<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

       header{
        height: 4rem;
        width: 100%;
        background-color: black;
        color: aliceblue;
        text-align: center;
        padding-top: 1rem;
       }

       nav{
        height: 3rem;
        width: 100%;
        background-color: yellowgreen;
        border: 2px solid black;
        position: sticky;
        top: 0;
       }

       body{
        height: 900vh;
        background: linear-gradient(red,blue,yellow,orange,pink);
       }

       #circle{
        height: 80px;
        width: 80px;
        border: 2px solid black;
        border-radius: 50px;
        background-color: whitesmoke;
        position: fixed;
        bottom: 10px;
        right: 10px;
       }
    </style>

</head>
<body>
    <header>100% Coconut Oil</header>

    <nav>This is navigation</nav>
    
    <div id="circle"></div>
</body>
</html>

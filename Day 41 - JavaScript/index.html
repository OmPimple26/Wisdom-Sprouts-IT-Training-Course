<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPS</title>
</head>
<body>
    <h1>OOPS</h1>

    <script>
        class Person{
            constructor(name,age){
                this.your_name = name;
                this.your_age = age;
            }

            greetings(){
                return `Hello ${this.your_name}, is your age ${this.your_age}?`;
            }

            get_name(name){
                console.log(`Hello my name is ${name}`)
            }
        }

        const P1 = new Person("Shubham", 40);
        const P2 = new Person("Darshana", 24);

        console.log(P1.greetings());
        console.log(P2.greetings());

        console.log(P2.get_name("Vishal"));
    </script>
</body>
</html>

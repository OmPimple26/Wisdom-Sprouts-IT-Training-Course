<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div>
          <h1>Task Manager</h1>
          <p>Manage your tasks easily</p>
        </div>

        <button id="darkModeBtn" class="dark-btn">Dark Mode</button>
      </header>

      <!-- Add Task -->
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="Enter task name" />

        <select id="categorySelect">
          <option value="Work">Work</option>

          <option value="Personal">Personal</option>

          <option value="Study">Study</option>
        </select>

        <select id="prioritySelect">
          <option value="Low">Low</option>

          <option value="Medium" selected>Medium</option>

          <option value="High">High</option>
        </select>

        <button type="submit" class="add-btn">Add Task</button>
      </form>

      <!-- Counters -->
      <div class="counters">
        <div class="counter">
          <h2 id="totalCount">0</h2>
          <p>Total Tasks</p>
        </div>

        <div class="counter">
          <h2 id="activeCount">0</h2>
          <p>Active Tasks</p>
        </div>

        <div class="counter">
          <h2 id="completedCount">0</h2>
          <p>Completed Tasks</p>
        </div>
      </div>

      <!-- Search and Filters -->
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search tasks..." />

        <select id="categoryFilter">
          <option value="All">All Categories</option>

          <option value="Work">Work</option>

          <option value="Personal">Personal</option>

          <option value="Study">Study</option>
        </select>

        <select id="statusFilter">
          <option value="All">All</option>

          <option value="Active">Active</option>

          <option value="Completed">Completed</option>
        </select>

        <select id="sortSelect">
          <option value="newest">Newest</option>

          <option value="oldest">Oldest</option>

          <option value="high-low">Priority: High → Low</option>

          <option value="low-high">Priority: Low → High</option>
        </select>
      </div>

      <!-- Task List -->
      <div id="taskList" class="task-list"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        You don't have any tasks yet. Add one!
      </div>

      <!-- Clear Completed -->
      <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodz - Fresh and Authentic Food</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <img src="images/logo.jpeg" alt="logo" />

      <a href="#">Home</a>
      <a href="#">Food</a>
      <a href="#">Discount</a>
      <a href="#">Contact Us</a>
    </nav>
    <!-- Navigation -->

    <!-- Hero Section -->
    <section id="hero">
      <img src="images/banner.jpg" alt="banner" />
      <h2>Best and Authentic Food</h2>
    </section>
    <!-- Hero Section -->

    <!-- Best Selling -->
    <section id="best_selling">
      <h2>Best Selling Foods</h2>

      <section style="display: flex; flex-direction: row; justify-content: space-around; flex-wrap: wrap; gap: 30px;">
        <div class="card">
          <div class="image">
            <img src="images/Paneer_tikka.jpg" alt="Paneer Tikka" />
            <p>₹300</p>
          </div>

          <div class="food-info">
            <h4>Paneer Tikka</h4>
            <button>Add to Cart</button>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/Momo.jpg" alt="Momos" />
            <p>₹140</p>
          </div>

          <div class="food-info">
            <h4>Momos</h4>
            <button>Add to Cart</button>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/Chowmein.jpg" alt="Chowmein" />
            <p>₹100</p>
          </div>

          <div class="food-info">
            <h4>Chowmein</h4>
            <button>Add to Cart</button>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/Pizza.jpg" alt="Pizza" />
            <p>₹200</p>
          </div>

          <div class="food-info">
            <h4>Pizza</h4>
            <button>Add to Cart</button>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/Burger.jpg" alt="Burger" />
            <p>₹160</p>
          </div>

          <div class="food-info">
            <h4>Burger</h4>
            <button>Add to Cart</button>
          </div>
        </div>

        <div class="card">
          <div class="image">
            <img src="images/Chicken_65.jpg" alt="Chicken 65" />
            <p>₹120</p>
          </div>

          <div class="food-info">
            <h4>Chicken 65</h4>
            <button>Add to Cart</button>
          </div>
        </div>
      </section>
    </section>
    <!-- Best Selling -->

    <!-- Offers -->
    <section id="offers"></section>
    <!-- Offers -->
  </body>
</html>
